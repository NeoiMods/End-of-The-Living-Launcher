# configVersion=13
# Viewpoint Advanced Flashlight live tuning. Saved changes apply while the game runs (about once a second).
# Switch modes with the key set in Options > Mods > Viewpoint Advanced Flashlight (default Shift + F),
# or from the hold-F radial menu.
falloffPowerFlood=1.5
falloffPowerSpot=1.2
falloffPowerThrow=0.6
falloffRef=4
# Beam pattern (t_flashlightpattern.png, baked in). Read when the shader loads: restart the game after changing it.
# patternGamma 1 = use the image brightness as is; above 1 = more contrast (darker gaps), below 1 = flatter.
# The pattern's outer edge sits at each mode's spot.flashCos, so flashCos sets how wide the pattern is projected.
patternGamma=1
# patternFlood=0: flood mode keeps the original (untextured) beam, spot and throw get the texture. 1 = texture in flood too (restart).
# Battery sag (v15). Level comes from the held flashlight. All optional; defaults are built in.
# batteryEnabled=1  batteryDimAt20=0.65 (brightness left at 20%)  batteryCliffDrop=0.7  batteryEmptyBrightness=0.5
# batteryAmberR=1  batteryAmberG=0.55  batteryAmberB=0.15  (colour multipliers at full amber; read when the shader loads, restart to change)
# batteryAmber=0 turns the amber colour shift off (it is packed into flashScatter and decoded in the shader).
# Rotational weight: the beam trails quick turns (left/right and up/down), then catches up. dragEnabled=0 turns it off (restart).
# Live: dragSpringFreq (16 = stiffer/faster), dragSpringDamp (0.55; lower = more overshoot), dragAmount = strength (1.0), dragLimit = biggest lag in radians (0.2),
# dragPitchSign / dragYawSign = 1 or -1 (flip if that lag goes the wrong way; yaw sign is only used if the hand position cannot be used to learn it).
# Lighter flame (v25, live): lighterFlicker (1 = on), lighterFlickerMin (0.7 = dims to 70%), lighterFlickerSpeed (1.0).
# In-game settings (Options > Mods > Viewpoint Advanced Flashlight) are saved in ViewpointAdvancedFlashlight_settings.txt and
# override the same keys here. Live switches: batteryAmber, batteryDim, batteryFlicker, dragEnabled, freezeEnabled, lighterFlicker.
# Winter (v18, live): freezeEnabled (1), freezeMax (1.0 = extra drain at -15C and below, so 2x total), blizzardExtra (0.5),
# Hit flicker (v45, live): noiseEnabled (1 = on): a small flicker when you hit or shove a zombie. Set in Options > Mods.
# Multiplayer (v40): mpShaderEffects=1 (0 = online, switch off drag, amber and blood tint in case other players' flashlights show yours; restart).
# freezeCoolTime (90 s for the battery to chill), warmTime (30 s to warm up indoors), freezeRecover (0 = none; 0.5 gives back
# half of the cold-lost charge once the battery is warm again).

[flood]
# Forward-only wide cone: flashCos 0.5 = 60 degrees each side of the aim direction.
# Raise it (0.6, 0.7) for a narrower cone, lower it (0.4) for wider.
# coronaStrength / flashScatter 0 remove the glow that spills around and behind the player.
# floodBoost=2.0 makes flood brighter (1 = the old strength). Add it to this section to change it; live.
spot.flashCos=0.5
spot.flashStrength=1.0
spot.flashRange=30
flashHot=0.6
flashIntensity=8
flashScatter=0
beamReach=2
coronaStrength=0

[spot]
spot.flashCos=0.9
spot.flashStrength=3.5
spot.flashRange=80
flashHot=0.1
flashIntensity=20
flashScatter=1.2
beamReach=4.5

[throw]
spot.flashCos=0.97
spot.flashStrength=5.0
spot.flashRange=300
flashHot=0.06
flashIntensity=20
flashScatter=0.8
beamReach=8
