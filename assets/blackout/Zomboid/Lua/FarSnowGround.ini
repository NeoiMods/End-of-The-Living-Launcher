# FarSnowGround settings (restart the game after editing)
# New options are added to this file automatically after an update; your values are kept.
configVersion=2

# turn the whole mod off without unsubscribing
enabled=true
# how white the far ground gets at full snow cover, 0..1
strength=0.90
# snow cover (0..1) below which nothing changes
minCover=0.05
# colour of the snow, hex RRGGBB
snowColour=EAF0F8
# pixels darker than this (0..255, forest, water) are whitened less
darkLimit=70
# how much of the strength those dark pixels get, 0..1
darkFactor=0.35
# whiten the far horizon live in the shader (false: one-off blend at chunk load)
liveHorizon=true
# also whiten the mid-distance ground (set false if it causes any trouble)
shellGround=true
# no snow colour outside the winter where vanilla draws no ground snow
seasonCheck=true
# seconds the ground takes to fade when the snow cover changes, 0 = instant
easeSeconds=3.0
# write [FARSNOW] diagnostics to console.txt
debug=false
