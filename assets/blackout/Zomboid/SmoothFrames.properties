# Viewpoint - Smooth Frames: switches for the speed-ups. Everything is on by default.
# Set a line to false to turn that part off (takes effect the next time the game starts).

# One hash lookup per Lua table read instead of two (the Lua interpreter's hottest call after its main loop).
fastTables=true

# Finish at most a few map chunks per frame instead of all of them at once, so walking or driving into
# new areas doesn't make one long frame. chunkBudgetMs: once a frame has run this long, the next queued
# chunk waits for the following frame (the first chunk of a frame is never delayed).
chunkPacing=true
chunkBudgetMs=8

# Skip recalculating the bones of parked vehicles' doors, hoods and windows when their pose can't change.
vehicleAnim=true
